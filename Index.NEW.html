<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NSW Question Bank - English</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--nsw-blue:#002664;--nsw-sky:#e6efff;--surface:#fff;--surface-2:#f8fafc;--border:#d9e1ec;--text:#0f1a2e;--text-2:#4a5a75}
    body{font-family:Inter,system-ui,sans-serif;background:var(--surface-2);color:var(--text)}
    .mono{font-family:JetBrains Mono,monospace}
  </style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useMemo} = React;

function App(){
  const [problems,setProblems]=useState([]);
  const [loading,setLoading]=useState(true);
  const [error,setError]=useState("");
  const [stage,setStage]=useState("all");
  const [search,setSearch]=useState("");
  const [page,setPage]=useState(1);
  const perPage=12;
  
  useEffect(()=>{
    fetch(`/api/problems?lang=en&stage=${stage}`)
      .then(r=>r.json())
      .then(data=>{
        if(data.error) throw new Error(data.error);
        setProblems(Array.isArray(data)?data:[]);
        setLoading(false);
      })
      .catch(e=>{setError(e.message); setLoading(false);});
  },[stage]);
  
  const filtered = useMemo(()=>{
    let d=problems;
    if(search.trim()){
      const q=search.toLowerCase();
      d=d.filter(p=> (p.stem||"").toLowerCase().includes(q) || (p.skillCode||"").toLowerCase().includes(q) || String(p.id).toLowerCase().includes(q));
    }
    return d;
  },[problems,search]);
  
  const totalPages=Math.ceil(filtered.length/perPage);
  const paged=filtered.slice((page-1)*perPage, page*perPage);
  
  if(loading) return <div className="min-h-screen flex items-center justify-center"><div className="text-center"><div className="w-8 h-8 border-4 border-slate-200 border-t-[#002664] rounded-full animate-spin mx-auto"></div><p className="mt-3 mono text-sm">Loading from D1...</p></div></div>;
  if(error) return <div className="p-8"><div className="bg-red-50 border border-red-200 p-4 rounded-xl">Error: {error}<br/>Check /api/problems endpoint and D1 binding DB</div></div>;
  
  return (
    <div className="min-h-screen">
      <header className="sticky top-0 z-20 bg-white/90 backdrop-blur border-b">
        <div className="max-w-[1280px] mx-auto px-4 py-4 flex justify-between items-center">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-xl bg-[#002664] text-white flex items-center justify-center font-bold">NSW</div>
            <div>
              <h1 className="font-bold text-[18px] leading-none">NSW Question Bank v3 - EN</h1>
              <p className="text-[11px] text-slate-500 mono">D1 Connected · {problems.length} real problems · q_en only</p>
            </div>
          </div>
          <div className="flex gap-2">
            <a href="/index_kr.html" className="px-3 py-1.5 rounded-full bg-slate-100 border text-[12px]">한국어</a>
            <span className="px-3 py-1.5 rounded-full bg-[#e6efff] border text-[11px] mono">{problems.length} problems</span>
          </div>
        </div>
        <div className="max-w-[1280px] mx-auto px-4 pb-3 flex gap-2 flex-wrap">
          <div className="flex gap-1 p-1 rounded-xl bg-slate-100 border">
            <button onClick={()=>{setStage("all");setPage(1)}} className={`px-3 py-1.5 rounded-lg text-[12px] ${stage==="all"?"bg-white shadow font-bold":""}`}>All Stages</button>
            {[1,2,3,4,5,6].map(s=><button key={s} onClick={()=>{setStage(String(s));setPage(1)}} className={`px-2.5 py-1.5 rounded-lg text-[12px] ${stage===String(s)?"bg-white shadow font-bold":""}`}>S{s}</button>)}
          </div>
          <div className="relative">
            <input value={search} onChange={e=>{setSearch(e.target.value);setPage(1)}} placeholder="Search ID, skill, stem..." className="w-[260px] pl-8 pr-3 py-2 rounded-xl bg-slate-50 border text-[13px]" />
            <span className="absolute left-3 top-2.5 text-slate-400">⌕</span>
          </div>
        </div>
      </header>
      
      <main className="max-w-[1280px] mx-auto px-4 py-6">
        <div className="mb-4 p-3 rounded-xl bg-green-50 border border-green-200 text-[12px]">
          ✅ Connected to D1 via <code>/api/problems?lang=en</code> - Using <b>q_en</b> field only, no Korean. Source: problem_bank.json (51 real items)
        </div>
        
        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
          {paged.map(p=>(
            <div key={p.id} className="rounded-2xl bg-white border p-4 flex flex-col gap-3 hover:shadow-md transition">
              <div className="flex justify-between">
                <div className="flex gap-1.5">
                  <span className="px-2 py-0.5 rounded-full bg-[#e6efff] text-[#002664] text-[10px] font-bold mono">S{p.stage}</span>
                  <span className="px-2 py-0.5 rounded-full bg-slate-50 text-[10px] mono border">{p.subject}</span>
                  <span className="px-2 py-0.5 rounded-full bg-slate-50 text-[10px] mono border">{p.difficulty}</span>
                </div>
                <span className="text-[10px] mono text-slate-400">{p.id}</span>
              </div>
              <div className="flex gap-1.5">
                <span className="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 border mono">{p.skillCode}</span>
                <span className="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 border mono">{p.abilityCode}</span>
              </div>
              <p className="text-[13px] font-medium leading-[1.5] line-clamp-3">{p.stem}</p>
              <div className="grid grid-cols-2 gap-1.5">
                {p.options.map((opt,i)=>(
                  <div key={i} className={`text-[11px] px-2.5 py-2 rounded-xl border ${i===p.answer?"bg-green-50 border-green-200 text-green-800 font-bold":"bg-slate-50 border-slate-200"}`}>
                    <span className="mono mr-1">{String.fromCharCode(65+i)}.</span>{opt}
                  </div>
                ))}
              </div>
              {p.explanation && <div className="text-[11px] text-slate-500 bg-slate-50 rounded-xl p-2.5 border border-dashed">💡 {p.explanation.slice(0,120)}</div>}
            </div>
          ))}
        </div>
        
        <div className="mt-6 flex justify-between items-center">
          <span className="text-[12px] mono text-slate-500">{filtered.length} items · page {page}/{totalPages||1}</span>
          <div className="flex gap-2">
            <button disabled={page<=1} onClick={()=>setPage(p=>Math.max(1,p-1))} className="px-3 py-1.5 rounded-xl border bg-white text-[12px] disabled:opacity-40">Prev</button>
            <button disabled={page>=totalPages} onClick={()=>setPage(p=>Math.min(totalPages,p+1))} className="px-3 py-1.5 rounded-xl border bg-white text-[12px] disabled:opacity-40">Next</button>
          </div>
        </div>
      </main>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
