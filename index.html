export async function onRequestGet({ request, env }) {
  try {
    const url = new URL(request.url);
    const lang = url.searchParams.get('lang') || 'en';
    const skill = url.searchParams.get('skill');
    const stage = url.searchParams.get('stage');

    let query = 'SELECT * FROM problems WHERE lang = ?';
    const params = [lang];
    if (skill && skill !== 'All') { query += ' AND skill = ?'; params.push(skill); }
    if (stage && stage !== 'All') { query += ' AND stage = ?'; params.push(stage); }
    query += ' ORDER BY created_at DESC LIMIT 5000';

    const { results } = await env.DB.prepare(query).bind(...params).all();

    // Map to frontend shape - supports both old and new columns
    const problems = results.map(r => ({
      id: r.id,
      question: r.question,
      options: (() => { try { return JSON.parse(r.options); } catch { return [r.option_a, r.option_b, r.option_c, r.option_d].filter(Boolean); } })(),
      answer: r.answer_index ?? r.answer ?? 0,
      explanation: r.explanation || '',
      skill: r.skill || 'General',
      tag: r.tag || r.topic || 'Stage 2',
      stage: r.stage || 'Stage 2',
      lang: r.lang || 'en'
    }));

    return new Response(JSON.stringify({ problems, count: problems.length }), {
      headers: { 'Content-Type': 'application/json', 'Cache-Control': 'no-cache' }
    });
  } catch (e) {
    return new Response(JSON.stringify({ error: e.message, problems: [] }), { status: 500, headers: { 'Content-Type': 'application/json' } });
  }
}

export async function onRequestPost({ request, env }) {
  try {
    const { problems } = await request.json();
    if (!Array.isArray(problems) || problems.length === 0) {
      return new Response(JSON.stringify({ error: 'No problems provided' }), { status: 400, headers: { 'Content-Type': 'application/json' } });
    }

    let saved = 0;
    let skipped = 0;

    // Composite dedup: question + options JSON
    for (const p of problems) {
      const question = (p.question || '').trim();
      if (!question) { skipped++; continue; }
      const optionsJson = JSON.stringify(p.options || []);
      const compositeKey = question + '|' + optionsJson;

      // Check duplicate via composite hash (question exact)
      const existing = await env.DB.prepare(
        'SELECT id FROM problems WHERE question = ? LIMIT 1'
      ).bind(question).first();

      if (existing) { skipped++; continue; }

      const id = p.id || crypto.randomUUID();
      const skill = p.skill || 'General';
      const tag = p.tag || 'Stage 2';
      const stage = p.stage || 'Stage 2';
      const explanation = p.explanation || '';
      const answer = p.answer ?? 0;
      const lang = p.lang || 'en';

      // Support both schemas: new columns (question, options, explanation, skill, tag) + old (option_a-d)
      const option_a = p.options?.[0] || '';
      const option_b = p.options?.[1] || '';
      const option_c = p.options?.[2] || '';
      const option_d = p.options?.[3] || '';

      await env.DB.prepare(
        \`INSERT INTO problems 
        (id, question, options, explanation, skill, tag, stage, lang, answer, answer_index, option_a, option_b, option_c, option_d, topic, created_at)
        VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, datetime('now'))
        ON CONFLICT(id) DO NOTHING\`
      ).bind(
        id, question, optionsJson, explanation, skill, tag, stage, lang, answer, answer,
        option_a, option_b, option_c, option_d, tag
      ).run();

      saved++;
    }

    return new Response(JSON.stringify({ saved, skipped, total: problems.length }), {
      headers: { 'Content-Type': 'application/json' }
    });
  } catch (e) {
    return new Response(JSON.stringify({ error: e.message }), { status: 500, headers: { 'Content-Type': 'application/json' } });
  }
}
